[project]
name = "ia-mecanica"
version = "0.1.0"
description = "Backend del agente IA Mecánica: API FastAPI protegida con Supabase Auth, agente LangGraph y RAG"
readme = "README.md"
# 3.15 aún no tiene wheels de pydantic-core/torch -> uv intenta compilar con Rust y falla.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.31.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
